<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
    <body>
      <div class="container">
        <div class="search">
          <input type="text" placeholder="Enter city name.." />
          <button><img src="images/search.png"/></button>
        </div>
        <div class="weatherError">
          <p id="weather-error"></p>
        </div>
            <div class="weather">
              <img id="weatherIcon" src="images/rain.png" class="weather-icon" />
              <h1 id="temp" class="temp"></h1>
              <h2 id="city" class="city"></h2>
              <h3 id="condition" class="condition"></h3>
              <div class="details">
                <div class="col">
                  <img src="images/humidity.png" />
                  <div class="d1">
                  <p id="humidity" class="humidity"></p>
                  <p>Humidity</p>
                  </div>
                </div>
                <div class="col">
                  <img src="images/wind.png" />
                  <div class="d2">
                  <p id="wind" class="wind"></p>
                  <p>Wind Speed</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <script src="script.js"></script>
    </body>
</html>
